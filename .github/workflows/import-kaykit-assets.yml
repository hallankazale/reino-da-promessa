name: Import KayKit CC0 Assets

on:
  push:
    branches:
      - feat/kaykit-visual-upgrade-v1
    paths:
      - .github/workflows/import-kaykit-assets.yml

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project branch
        uses: actions/checkout@v4
        with:
          ref: feat/kaykit-visual-upgrade-v1
          fetch-depth: 0

      - name: Fetch pinned KayKit sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/KayKit-Game-Assets/KayKit-Character-Pack-Adventures-1.0.git /tmp/kaykit-adventurers
          git -C /tmp/kaykit-adventurers checkout 672074b73ba276876a19e8816ecdc5241817ab47
          git clone --filter=blob:none https://github.com/KayKit-Game-Assets/KayKit-Dungeon-Remastered-1.0.git /tmp/kaykit-dungeon
          git -C /tmp/kaykit-dungeon checkout b0ca9bd96a8072ab36a3a5464f00ed1e06a16d07

      - name: Copy curated CC0 assets
        shell: bash
        run: |
          set -euo pipefail
          CHAR_SRC=/tmp/kaykit-adventurers/addons/kaykit_character_pack_adventures/Characters/gltf
          DUNGEON_SRC=/tmp/kaykit-dungeon/addons/kaykit_dungeon_remastered/Assets/gltf
          mkdir -p assets/third_party/kaykit_adventurers assets/third_party/kaykit_dungeon

          cp "$CHAR_SRC/Knight.glb" assets/third_party/kaykit_adventurers/Knight.glb
          cp "$CHAR_SRC/Mage.glb" assets/third_party/kaykit_adventurers/Mage.glb
          cp "$CHAR_SRC/Barbarian.glb" assets/third_party/kaykit_adventurers/Barbarian.glb
          cp "$CHAR_SRC/Rogue_Hooded.glb" assets/third_party/kaykit_adventurers/Rogue_Hooded.glb
          cp /tmp/kaykit-adventurers/LICENSE.txt assets/third_party/kaykit_adventurers/LICENSE.txt

          copy_prop() {
            local pattern="$1"
            local out="$2"
            local src
            src=$(find "$DUNGEON_SRC" -maxdepth 1 -type f -iname "$pattern" | sort | head -n 1)
            test -n "$src"
            cp "$src" "assets/third_party/kaykit_dungeon/$out"
          }

          copy_prop 'barrel_small*.glb' 'barrel_small.glb'
          copy_prop 'crate*.glb' 'crate.glb'
          copy_prop 'chest*.glb' 'chest.glb'
          copy_prop 'torch*.glb' 'torch.glb'
          copy_prop 'pillar*.glb' 'pillar.glb'
          copy_prop 'banner_blue*.glb' 'banner_blue.glb'
          cp /tmp/kaykit-dungeon/LICENSE.txt assets/third_party/kaykit_dungeon/LICENSE.txt

      - name: Record provenance
        shell: bash
        run: |
          cat > assets/third_party/kaykit_adventurers/SOURCE.md <<'EOF'
          # KayKit Adventurers
          Source: https://github.com/KayKit-Game-Assets/KayKit-Character-Pack-Adventures-1.0
          Pinned commit: 672074b73ba276876a19e8816ecdc5241817ab47
          License: CC0 1.0 Universal (see LICENSE.txt)
          Curated files: Knight.glb, Mage.glb, Barbarian.glb, Rogue_Hooded.glb
          EOF
          cat > assets/third_party/kaykit_dungeon/SOURCE.md <<'EOF'
          # KayKit Dungeon Remastered
          Source: https://github.com/KayKit-Game-Assets/KayKit-Dungeon-Remastered-1.0
          Pinned commit: b0ca9bd96a8072ab36a3a5464f00ed1e06a16d07
          License: CC0 1.0 Universal (see LICENSE.txt)
          Curated files: barrel, crate, chest, torch, pillar and banner props.
          EOF

      - name: Commit imported assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/third_party/kaykit_adventurers assets/third_party/kaykit_dungeon
          if git diff --cached --quiet; then
            echo 'No asset changes to commit.'
            exit 0
          fi
          git commit -m 'chore(assets): import curated KayKit CC0 pack'
          git push origin HEAD:feat/kaykit-visual-upgrade-v1
