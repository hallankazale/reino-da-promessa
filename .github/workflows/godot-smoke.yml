name: Godot Smoke Test

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64

      - name: Import project headless
        shell: bash
        run: |
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --headless \
            --path . \
            --editor \
            --quit-after 1

      - name: Run smoke test
        shell: bash
        run: |
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --headless \
            --path . \
            --script tests/smoke_test.gd
